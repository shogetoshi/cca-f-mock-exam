ion defines a tool that lets Claude request file contents; Claude invokes this tool, receives results, and continues its analysis. You're evaluating batch processing to reduce API costs.\n\nWhat is the primary technical constraint when considering batch processing for this workflow?", "options": {"A": "Batch processing lacks request correlation identifiers for matching outputs to input requests.", "B": "The batch API doesn't support tool definitions in request parameters.", "C": "The asynchronous model prevents executing tools mid-request and returning results for Claude to continue analysis.", "D": "Batch processing latency of up to 24 hours is too slow for pull request feedback, though the workflow could otherwise function."}, "correct": "C", "explanation": "This is correct. The batch API's asynchronous fire-and-forget model means there is no mechanism to intercept a tool call mid-request, execute the tool, and return results for Claude to continue its analysis. This fundamentally breaks iterative tool-calling workflows that require multiple rounds of tool invocation and response within a single logical interaction.", "study_area": "Claude Code for Continuous Integration — review _Batch Processing_ concepts in the exam study guide."}, {"question": "Your automated code review system shows inconsistent severity ratings—similar issues like null pointer risks receive \"critical\" severity in some PRs but only \"medium\" in others. Developer trust is declining because teams can't predict which findings require immediate attention. What's the most effective way to improve severity consistency?", "options": {"A": "Include explicit severity criteria in your prompt with concrete code examples for each severity level", "B": "Modify the prompt to ask Claude to rate severity relative to other issues in the same PR, so the most severe issue is always marked critical and others rated proportionally", "C": "Add a CLAUDE.md file that lists issue types and their default severities, instructing Claude to reference this mapping when assigning ratings", "D": "Request that Claude include its reasoning for each severity assignment, then use that reasoning to manually calibrate and adjust ratings during review"}, "correct": "A", "explanation": "Including explicit severity criteria with concrete code examples directly addresses the root cause of inconsistency by removing ambiguity about what each severity level means. This is a proven prompt engineering technique that gives the model clear reference points for classification, leading to more reliable and predictable severity assignments.", "study_area": ""}, {"question": "Your automated review generates test case suggestions for each PR. When reviewing a PR that adds course completion tracking, Claude suggests 10 test cases but developer feedback indicates 6 duplicate scenarios already covered in the existing test suite. What change would most effectively reduce duplicate suggestions?", "options": {"A": "Add instructions directing Claude to focus exclusively on edge cases and error conditions rather than successful paths", "B": "Include the existing test file in the context so Claude can identify what scenarios are already covered", "C": "Implement post-processing that filters suggestions whose descriptions match keywords from existing test names", "D": "Reduce requested suggestions from 10 to 5, assuming Claude will prioritize the most valuable cases first"}, "correct": "B", "explanation": "Including the existing test file in the context directly addresses the root cause of duplication: Claude can only avoid suggesting already-covered scenarios if it knows what tests already exist. This gives Claude the information needed to reason about which suggestions would be genuinely new and valuable.", "study_area": "Claude Code for Continuous Integration — review _Context Provision Methods_ concepts in the exam study guide."}, {"question": "Your automated reviews identify valid issues but developers report the feedback isn't actionable. Findings say things like \"complex ticket allocation logic\" or \"potential null pointer\" without specifying what to change. When you add detailed instructions like \"always include specific fix suggestions,\" the model still produces inconsistent output—sometimes detailed, sometimes vague. What prompting technique would most reliably produce consistently actionable feedback?", "options": {"A": "Expand the context window to include more of the surrounding codebase so the model has sufficient information to suggest specific fixes", "B": "Implement a two-pass approach where one prompt identifies issues and a second prompt generates fixes, allowing specialization", "C": "Add 3-4 few-shot examples showing the exact format you want: issue identified, code location, specific fix suggestion", "D": "Further refine the instructions with more explicit requirements for each part of the feedback format (location, issue, severity, suggested fix)"}, "correct": "C", "explanation": "Few-shot examples are the most effective technique for achieving consistent output format when instructions alone produce variable results. Providing 3-4 examples showing the exact desired format (issue, location, specific fix) gives the model a concrete pattern to follow, which is more reliable than abstract instructions.", "study_area": "Claude Code for Continuous Integration — review _Few-Shot Prompting_ concepts in the exam study guide."}, {"question": "Your CI pipeline runs the Claude Code CLI (with `--print` mode) using CLAUDE.md to provide project context for code reviews, and developers generally find the reviews insightful. However, they report that integrating findings into your workflow is difficult—Claude produces narrative paragraphs that must be manually copied into PR comments. Your team wants to automatically post each finding as a separate inline PR comment at the relevant code location, which requires structured data with file path, line number, severity, and suggested fix. What's the most effective approach?", "options": {"A": "Include explicit formatting instructions in your review prompt requiring each finding to follow a parseable template like `[FILE:path] [LINE:n] [SEVERITY:level] ...`.", "B": "Keep the narrative review format but add a summarization step that uses Claude to generate a structured JSON summary of the findings.", "C": "Add a \"Review Output Format\" section to CLAUDE.md with examples showing structured findings, so Claude learns the expected format from project context.", "D": "Use CLI flags `--output-format json` and `--json-schema` to enforce structured findings, then parse output to post inline comments via the GitHub API."}, "correct": "D", "explanation": "Using `--output-format json` with `--json-schema` enforces structured output at the CLI level, guaranteeing well-formed JSON with the required fields (file path, line number, severity, suggested fix) that can be reliably parsed and posted as inline PR comments via the GitHub API. This is the most effective approach because it leverages native CLI capabilities designed specifically for structured output enforcement.", "study_area": "Claude Code for Continuous Integration — review _Structured Output_ concepts in the exam study guide."}, {"question": "Your CI pipeline includes two Claude-powered code review modes: a `pre-merge-commit` hook that blocks PR merging until complete, and \"deep analysis\" that runs overnight, polls for batch completion, then posts detailed suggestions to the PR. You want to reduce API costs using the Message Batches API, which offers 50% cost savings but requires polling and may take up to 24 hours to complete. Which mode should use batch processing?", "options": {"A": "Deep analysis only", "B": "Pre-merge-commit hook only", "C": "Both modes", "D": "Neither mode"}, "correct": "A", "explanation": "Deep analysis is the ideal candidate for batch processing because it already runs overnight, tolerates latency, and uses a polling model to check for completion before posting results—perfectly matching the Message Batches API's asynchronous, poll-based design while capturing the 50% cost savings.", "study_area": ""}, {"question": "Your CI/CD system performs three types of Claude-powered analysis: (1) quick style checks on each PR that block merging until complete, (2) comprehensive security audits of the entire codebase run weekly, and (3) test case generation triggered nightly for recently-modified modules. The Message Batches API offers 50% cost savings but can take up to 24 hours to process. You want to optimize API costs while maintaining acceptable developer experience. Which combination correctly matches each task to its API approach?", "options": {"A": "Use synchronous calls for PR style checks and nightly test generation; use Message Batches API only for weekly security audits.", "B": "Use synchronous calls for PR style checks; use the Message Batches API for weekly security audits and nightly test generation.", "C": "Use synchronous calls for all three tasks for consistent response times, and rely on prompt caching to reduce costs across all workloads.", "D": "Use the Message Batches API for all three tasks to maximize the 50% cost savings, and configure the pipeline to poll for batch completion."}, "correct": "B", "explanation": "This is the correct approach. PR style checks block developers and require immediate responses via synchronous calls, while weekly security audits and nightly test generation are scheduled tasks with flexible timelines that can easily tolerate the up-to-24-hour batch processing window, capturing the 50% cost savings on both.", "study_area": "Claude Code for Continuous Integration — review _Batch Processing_ concepts in the exam study guide."}, {"question": "A pull request modifies 14 files across the stock tracking module. Your single-pass review analyzing all files together produces inconsistent results: detailed feedback for some files but superficial comments for others, obvious bugs missed, and contradictory feedback—flagging a pattern as problematic in one file while approving identical code elsewhere in the same PR. How should you restructure the review?", "options": {"A": "Run three independent review passes on the full PR and only flag issues that appear in at least two of the three runs.", "B": "Require developers to split large PRs into smaller submissions of 3-4 files before the automated review runs.", "C": "Switch to a higher-tier model with a larger context window to give all 14 files adequate attention in one pass.", "D": "Split into focused passes: analyze each file individually for local issues, then run a separate integration-focused pass examining cross-file data flow."}, "correct": "D", "explanation": "Splitting the review into focused per-file passes directly addresses the root cause of attention dilution, ensuring consistent depth and catching local issues reliably. A separate integration-focused pass then handles cross-file concerns like data flow dependencies, covering both dimensions of review quality.", "study_area": "Claude Code for Continuous Integration — review _Task Decomposition_ concepts in the exam study guide."}, {"question": "Your team wants to reduce API costs for automated analysis. Currently, real-time Claude calls power two workflows: (1) a blocking pre-merge check that must complete before developers can merge, and (2) a technical debt report generated overnight for review the next morning. Your manager proposes switching both to the Message Batches API for its 50% cost savings. How should you evaluate this proposal?", "options": {"A": "Use batch processing for the technical debt reports only; keep real-time calls for pre-merge checks.", "B": "Switch both workflows to batch processing with status polling to check for completion.", "C": "Keep real-time calls for both workflows to avoid batch result ordering issues.", "D": "Switch both to batch processing with a timeout fallback to real-time if batches take too long."}, "correct": "A", "explanation": "This is the correct approach because the Message Batches API's up to 24-hour processing time with no guaranteed latency SLA makes it ideal for overnight technical debt reports but unsuitable for blocking pre-merge checks where developers are waiting. This matches each workflow to the appropriate API based on its latency requirements.", "study_area": ""}, {"question": "Analysis of your automated code review shows significant variation in false positive rates across finding categories. Security and correctness findings have an 8% false positive rate, performance findings have 18%, style and naming findings have 52%, and documentation findings have 48%.\n\nDeveloper surveys indicate growing distrust—many have started dismissing findings without review because \"half are wrong.\" The high false positive categories are undermining confidence in the accurate categories. What approach best restores developer trust while improving the system?", "options": {"A": "Temporarily disable high false positive categories (style, naming, documentation) and run only high-precision categories while improving prompts.", "B": "Keep all categories but display a confidence score with each finding, letting developers decide which to investigate.", "C": "Keep all categories enabled while adding few-shot examples to improve each category's accuracy over the coming weeks.", "D": "Apply a uniform strictness reduction across all categories to bring the overall false positive rate to an acceptable level."}, "correct": "A", "explanation": "Temporarily disabling the high false positive categories (style, naming, documentation) immediately stops trust erosion by removing the noise that causes developers to dismiss all findings, while preserving the value of high-precision categories like security and correctness. This approach allows time to improve prompts for the problematic categories before re-enabling them, rebuilding trust through demonstrated accuracy.", "study_area": ""}];

const STATE_KEY = 'claude-mock-exam-state-v1';
const ORDER_KEY = 'claude-mock-exam-order-v1';

let currentView = 'list';
let currentOrderIdx = 0;
let questionOrder = [];

function loadState() {
  try { return JSON.parse(localStorage.getItem(STATE_KEY)) || {}; }
  catch { return {}; }
}
function saveState(s) { localStorage.setItem(STATE_KEY, JSON.stringify(s)); }
function loadOrder() {
  try {
    const raw = localStorage.getItem(ORDER_KEY);
    if (!raw) return null;
    const arr = JSON.parse(raw);
    if (Array.isArray(arr) && arr.length === QUESTIONS.length) return arr;
    return null;
  } catch { return null; }
}
function saveOrder(o) { localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }

function formatText(text) {
  const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
}

function updateProgress() {
  const state = loadState();
  const answered = Object.keys(state).length;
  const total = QUESTIONS.length;
  const correct = Object.values(state).filter(s => s.correct).length;
  document.getElementById('stats').textContent = answered + ' / ' + total + ' 回答済み · ' + correct + ' 正解';
  document.getElementById('progress').style.width = ((answered / total) * 100) + '%';
}

function renderList() {
  currentView = 'list';
  const state = loadState();
  const app = document.getElementById('app');
  app.innerHTML = '';

  const controls = document.createElement('div');
  controls.className = 'controls';
  controls.innerHTML =
    '<button class="btn btn-primary" id="shuffle-btn">シャッフル</button>' +
    '<button class="btn" id="reset-btn">リセット</button>';
  app.appendChild(controls);

  document.getElementById('shuffle-btn').addEventListener('click', doShuffle);
  document.getElementById('reset-btn').addEventListener('click', doReset);

  const grid = document.createElement('div');
  grid.className = 'question-grid';

  questionOrder.forEach(function(origIdx, dispIdx) {
    const q = QUESTIONS[origIdx];
    const s = state[origIdx];
    const cls = 'q-tile' + (s ? (s.correct ? ' correct' : ' incorrect') : '');
    const icon = s ? (s.correct ? '✓' : '✗') : '';
    const preview = q.question.replace(/`([^`]+)`/g, '$1').substring(0, 65) + '…';

    const tile = document.createElement('button');
    tile.className = cls;
    tile.innerHTML =
      '<div class="q-tile-header">' +
        '<span class="q-tile-num">Q' + (dispIdx + 1) + '</span>' +
        '<span class="q-tile-icon">' + icon + '</span>' +
      '</div>' +
      '<div class="q-tile-preview">' + preview + '</div>';
    tile.addEventListener('click', function() { showQuestion(dispIdx); });
    grid.appendChild(tile);
  });

  app.appendChild(grid);
  updateProgress();
}

function showQuestion(dispIdx) {
  currentView = 'question';
  currentOrderIdx = dispIdx;
  window.scrollTo(0, 0);

  const origIdx = questionOrder[dispIdx];
  const q = QUESTIONS[origIdx];
  const state = loadState();
  const saved = state[origIdx];
  const total = questionOrder.length;
  const isFirst = dispIdx === 0;
  const isLast = dispIdx === total - 1;

  const app = document.getElementById('app');
  app.innerHTML = '';

  // Navigation bar
  const nav = document.createElement('div');
  nav.className = 'question-nav';
  nav.innerHTML =
    '<button class="btn" id="back-btn">← 問題一覧</button>' +
    '<span class="nav-info">Q' + (dispIdx + 1) + ' / ' + total + '</span>' +
    '<div class="nav-spacer"></div>' +
    '<div class="nav-buttons">' +
      '<button class="btn" id="prev-btn"' + (isFirst ? ' disabled' : '') + '>‹ 前へ</button>' +
      '<button class="btn" id="next-btn"' + (isLast ? ' disabled' : '') + '>次へ ›</button>' +
    '</div>';
  app.appendChild(nav);

  document.getElementById('back-btn').addEventListener('click', function() { renderList(); window.scrollTo(0, 0); });
  if (!isFirst) document.getElementById('prev-btn').addEventListener('click', function() { showQuestion(dispIdx - 1); });
  if (!isLast) document.getElementById('next-btn').addEventListener('click', function() { showQuestion(dispIdx + 1); });

  // Question card
  const card = document.createElement('div');
  card.className = 'question-card';

  const header = document.createElement('div');
  header.className = 'question-header';
  header.innerHTML = '<span class="q-number">Q' + (dispIdx + 1) + '</span><span class="q-status" id="q-status"></span>';
  card.appendChild(header);

  const qtext = document.createElement('div');
  qtext.className = 'question-text';
  qtext.innerHTML = formatText(q.question);
  card.appendChild(qtext);

  const optsDiv = document.createElement('div');
  optsDiv.className = 'options';
  ['A', 'B', 'C', 'D'].forEach(function(letter) {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.dataset.letter = letter;
    btn.innerHTML = '<span class="letter">' + letter + '</span><span>' + formatText(q.options[letter]) + '</span>';
    btn.addEventListener('click', function() { handleAnswer(origIdx, letter); });
    optsDiv.appendChild(btn);
  });
  card.appendChild(optsDiv);

  const expl = document.createElement('div');
  expl.className = 'explanation';
  expl.id = 'explanation';
  expl.innerHTML =
    '<strong>正解: ' + q.correct + '</strong><br>' +
    formatText(q.explanation) +
    (q.study_area ? '<div class="study-area">' + formatText(q.study_area) + '</div>' : '');
  card.appendChild(expl);

  app.appendChild(card);

  if (saved) applyAnswerUI(origIdx, saved.selected);
}

function applyAnswerUI(origIdx, selected) {
  const q = QUESTIONS[origIdx];
  const isCorrect = selected === q.correct;
  document.querySelectorAll('.option').forEach(function(btn) {
    const letter = btn.dataset.letter;
    btn.disabled = true;
    if (letter === selected) {
      btn.classList.add('selected', isCorrect ? 'correct' : 'incorrect');
    } else if (letter === q.correct && !isCorrect) {
      btn.classList.add('reveal-correct');
    }
  });
  const expl = document.getElementById('explanation');
  if (expl) expl.classList.add('visible');
  const statusEl = document.getElementById('q-status');
  if (statusEl) {
    statusEl.textContent = isCorrect ? '✓ 正解' : '✗ 不正解';
    statusEl.className = 'q-status ' + (isCorrect ? 'correct' : 'incorrect');
  }
}

function handleAnswer(origIdx, letter) {
  const state = loadState();
  if (state[origIdx]) return;
  const q = QUESTIONS[origIdx];
  state[origIdx] = { selected: letter, correct: letter === q.correct };
  saveState(state);
  applyAnswerUI(origIdx, letter);
  updateProgress();
}

function doShuffle() {
  if (!confirm('問題をシャッフルします。進捗がリセットされます。よろしいですか？')) return;
  localStorage.removeItem(STATE_KEY);
  const newOrder = QUESTIONS.map(function(_, i) { return i; });
  for (let i = newOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = newOrder[i]; newOrder[i] = newOrder[j]; newOrder[j] = tmp;
  }
  questionOrder = newOrder;
  saveOrder(questionOrder);
  renderList();
  window.scrollTo(0, 0);
}

function doReset() {
  if (!confirm('全ての回答をリセットします。よろしいですか？')) return;
  localStorage.removeItem(STATE_KEY);
  localStorage.removeItem(ORDER_KEY);
  questionOrder = QUESTIONS.map(function(_, i) { return i; });
  renderList();
  window.scrollTo(0, 0);
}

document.getElementById('title-btn').addEventListener('click', function() {
  if (currentView === 'question') { renderList(); window.scrollTo(0, 0); }
});

questionOrder = loadOrder() || QUESTIONS.map(function(_, i) { return i; });
updateProgress();
renderList();
</script>
</body>
</html>
